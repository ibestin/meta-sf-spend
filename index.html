<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Meta Ads to Salesforce Admin</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#e2e6ec;--acc:#1f5eff;--head:#eef1f6;--warn:#b45309;--bad:#b91c1c;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--ink:#e6eaf0;--mut:#93a0b2;--line:#2a323e;--acc:#6b9cff;--head:#222a35;--warn:#f0b35a;--bad:#f28b8b;--ok:#6ccf8e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:20}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}
h3{margin:0 0 6px}
.bar{margin-left:auto;display:flex;gap:8px;align-items:center}
a{color:var(--acc)}
select,input[type=text],input[type=password]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:100%}
select{width:auto}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mut);cursor:pointer}
button.btn{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
button.btn:hover:not(:disabled){border-color:var(--acc)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:14px 16px;max-width:1200px}
.note{color:var(--mut);margin:0 0 10px}
.banner{background:rgba(180,83,9,.1);border:1px solid var(--warn);color:var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.card h3{font-size:14px;margin-bottom:2px}
.card .d{color:var(--mut);font-size:12px;margin-bottom:8px}
.drop{display:block;border:1.5px dashed var(--line);border-radius:6px;padding:10px;text-align:center;color:var(--mut);cursor:pointer}
.drop.over,.drop:hover{border-color:var(--acc);color:var(--acc)}
.drop input{display:none}
.st{font-size:12px;margin-top:8px}
.st.ok{color:var(--ok)}.st.err{color:var(--bad)}.st.no{color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px;margin-bottom:12px}
.grid label{display:block;color:var(--mut);font-size:12px}
.grid label input{margin-top:3px;color:var(--ink);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{margin-top:10px;font-size:13px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}.msg.busy{color:var(--mut)}
table.h{border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line)}
table.h td,table.h th{padding:5px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.h th{background:var(--head)}
table.h td.v{text-align:right;font-variant-numeric:tabular-nums}
table.h td.n{color:var(--mut);font-size:12px}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.sum div{background:var(--head);border-radius:6px;padding:8px 10px}
.sum b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.sum span{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Meta Ads &rarr; Salesforce &middot; Admin</h1>
    <div class="bar"><a href="view.html" target="_blank" rel="noopener">Open public view</a></div>
  </div>
</header>
<main id="main"></main>

<script>
(function(){
'use strict';

/* ---------- File definitions ---------- */
const DEFS=[
 {id:'spend',label:'Meta Spend',desc:'Ad-wise daily spend export (CSV). Needs: Ad set name, Ad name, Day, Amount spent (INR).',
  cols:{campaign:['campaign name'],adset:['ad set name','adset name'],ad:['ad name'],day:['day','date'],amount:['amount spent (inr)','amount spent','spend']},
  order:['campaign','adset','ad','day','amount'],optional:['campaign']},
 {id:'leads',label:'Meta Leads',desc:'Meta lead dump (CSV). Needs: created_time, ad_name, adset_name, phone_number. Should reach further back than the SF files.',
  cols:{campaign:['campaign_name','campaign name'],adset:['adset_name','ad set name','adset name'],ad:['ad_name','ad name'],created:['created_time','created time'],organic:['is_organic'],phone:['phone_number','phone','phone number']},
  order:['campaign','adset','ad','created','organic','phone'],optional:['campaign','organic']},
 {id:'gen',label:'SF Generated',desc:'Optional. Used only for the Meta-to-SF sync check. Needs: Phone, Ad set Name, Enquiry Source: Created Date.',
  cols:{phone:['phone','mobile'],adset:['ad set name','adset name'],date:['enquiry source: created date']},
  order:['phone','adset','date'],optional:['date']},
 {id:'fresh',label:'SF Fresh leads',desc:'Leads new to Salesforce in the period. Needs: Mobile, Ad set Name, Quality Type (for Invalid Leads).',
  cols:{phone:['mobile','phone','phone number'],adset:['ad set name','adset name'],qtype:['quality type','lead: quality type']},order:['phone','adset','qtype'],optional:['qtype']},
 {id:'qual',label:'SF Qualified',desc:'Qualified leads. Needs: Mobile, Ad set Name.',
  cols:{phone:['mobile','phone','phone number'],adset:['ad set name','adset name']},order:['phone','adset'],optional:[]},
 {id:'td',label:'SF Test Drive file',desc:'Test drive completed leads. Needs: Mobile, Ad set Name.',
  cols:{phone:['mobile','phone','phone number'],adset:['ad set name','adset name']},order:['phone','adset'],optional:[]}
];

/* ---------- State ---------- */
const DEFCFG={owner:'ibestin',repo:'meta-sf-spend',branch:'main',path:'data/data.json',token:'',remember:true};
const S={dmy:true,files:{},errors:{},busy:{},idbOk:true,cfg:Object.assign({},DEFCFG),pub:{state:'idle',msg:''}};
let D=null;
const PK='metaSfAdmin.prefs.v1';
function loadPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem(PK)||'{}');
    if('dmy' in p)S.dmy=!!p.dmy;
    if(p.cfg&&typeof p.cfg==='object')for(const k of Object.keys(DEFCFG))if(k in p.cfg)S.cfg[k]=p.cfg[k];
  }catch(e){}
}
function savePrefs(){
  try{
    const c=Object.assign({},S.cfg);if(!c.remember)c.token='';
    localStorage.setItem(PK,JSON.stringify({dmy:S.dmy,cfg:c}));
  }catch(e){}
}

/* ---------- Helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const p2=n=>String(n).padStart(2,'0');
const nk=s=>String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase();
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function addDays(d,n){return new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);}
function dayDiff(a,b){return Math.round((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/864e5);}
function fmtDT(ms){const d=new Date(ms+330*60000);return d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+' '+d.getUTCFullYear()+', '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+' IST';}

/* ---------- Parsing ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const nl=text.search(/\r|\n/);const first=text.slice(0,nl<0?text.length:nl);
  const cnt={',':0,'\t':0,';':0};let q0=false;
  for(const ch of first){if(ch==='"')q0=!q0;else if(!q0&&ch in cnt)cnt[ch]++;}
  let delim=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];if(!cnt[delim])delim=',';
  const rows=[];let row=[],field='',q=false,i=0;const n=text.length;
  while(i<n){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue;}q=false;i++;continue;}
      field+=c;i++;
    }else if(c==='"'&&field===''){q=true;i++;}
    else if(c===delim){row.push(field);field='';i++;}
    else if(c==='\n'||c==='\r'){
      row.push(field);field='';if(c==='\r'&&text[i+1]==='\n')i++;i++;
      if(row.length>1||row[0]!=='')rows.push(row);row=[];
    }else{field+=c;i++;}
  }
  if(field!==''||row.length){row.push(field);if(row.length>1||row[0]!=='')rows.push(row);}
  return rows;
}
function cleanPhone(v){
  let s=String(v==null?'':v).trim();
  if(!s)return null;
  if(/^\d+(\.\d+)?e[+-]?\d+$/i.test(s))return null;
  s=s.replace(/\.0+$/,'');
  const d=s.replace(/\D/g,'');
  return d.length>=10?d.slice(-10):null;
}
function parseAmt(v){
  const s=String(v==null?'':v).replace(/[^0-9.\-]/g,'');
  if(s===''||s==='-'||s==='.')return 0;
  const n=parseFloat(s);return isNaN(n)?null:n;
}
function mkDT(y,mo,d,h,mi,s){
  if(mo<1||mo>12||d<1||d>31)return null;
  if(new Date(Date.UTC(y,mo-1,d)).getUTCMonth()!==mo-1)return null;
  return {d:y+'-'+p2(mo)+'-'+p2(d),t:(+h||0)*3600+(+mi||0)*60+(+s||0)};
}
function parseDT(v,dmy){
  if(v==null)return null;const s=String(v).trim();if(!s)return null;let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]+(\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?\s*(Z|[+-]\d{2}:?\d{2})?)?/))){
    if(m[7]&&m[4]!=null){
      let off=0;if(m[7]!=='Z'){const z=m[7].replace(':','');off=(z[0]==='-'?-1:1)*(+z.slice(1,3)*60+ +z.slice(3,5));}
      const x=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))-off*60000+330*60000);
      return mkDT(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate(),x.getUTCHours(),x.getUTCMinutes(),x.getUTCSeconds());
    }
    return mkDT(+m[1],+m[2],+m[3],m[4],m[5],m[6]);
  }
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[,T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?)?/))){
    let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    let dd=dmy?a:b,mm=dmy?b:a;if(mm>12&&dd<=12){const t=dd;dd=mm;mm=t;}
    let h=m[4];if(m[7]&&h!=null){h=(+h)%12;if(/p/i.test(m[7]))h+=12;}
    return mkDT(y,mm,dd,h,m[5],m[6]);
  }
  if((m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-,]+(\d{2,4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))){
    const mo=MON[m[2].toLowerCase()];if(!mo)return null;let y=+m[3];if(y<100)y+=2000;
    return mkDT(y,mo,+m[1],m[4],m[5],m[6]);
  }
  if(/^\d{5}(\.\d+)?$/.test(s)){
    const x=new Date(Date.UTC(1899,11,30)+Math.round(parseFloat(s)*864e5));
    return mkDT(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate(),x.getUTCHours(),x.getUTCMinutes(),x.getUTCSeconds());
  }
  return null;
}
function mapCols(def,header){
  const h=header.map(x=>String(x).replace(/^\uFEFF/,'').trim().replace(/\s+/g,' ').toLowerCase());
  const idx={},missing=[];
  for(const k of Object.keys(def.cols)){
    let i=-1;for(const al of def.cols[k]){i=h.indexOf(al);if(i>=0)break;}
    idx[k]=i;if(i<0&&!def.optional.includes(k))missing.push(def.cols[k][0]);
  }
  if(missing.length)throw new Error('Missing column'+(missing.length>1?'s':'')+': '+missing.map(m=>'"'+m+'"').join(', ')+'. Columns found: '+header.slice(0,30).join(' | '));
  return idx;
}

/* ---------- IndexedDB (persist parsed files in this browser) ---------- */
const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('metaSfDash',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>{IDB.db=r.result;res(true);};r.onerror=()=>res(false);}catch(e){res(false);}});},
  tx(mode,fn){return new Promise(res=>{if(!IDB.db)return res(null);try{const t=IDB.db.transaction('files',mode);const rq=fn(t.objectStore('files'));t.oncomplete=()=>res(rq?rq.result:true);t.onerror=t.onabort=()=>res(null);}catch(e){res(null);}});},
  get(k){return IDB.tx('readonly',s=>s.get(k));},
  set(k,v){return IDB.tx('readwrite',s=>s.put(v,k));},
  del(k){return IDB.tx('readwrite',s=>s.delete(k));}
};

/* ---------- Core computation ---------- */
// metric index: 0 spend, 1 leads, 2 fresh, 3 qualified, 4 test drives, 5 invalid leads
const INVALID_TAGS=new Set(['not enquired','invalid number','non-sales related','wrong number','aftersales']);
function compute(){
  const F=S.files,dmy=S.dmy,ads=new Map(),st={};
  const getAd=(adset,ad,camp)=>{
    const k=nk(adset)+'||'+nk(ad);let a=ads.get(k);
    if(!a){a={key:k,ad:String(ad).trim(),adset:String(adset).trim(),campaign:String(camp||'').trim(),days:{}};ads.set(k,a);}
    else if(!a.campaign&&camp)a.campaign=String(camp).trim();
    return a;
  };
  const cell=(a,d)=>a.days[d]||(a.days[d]=[0,0,0,0,0,0]);

  if(F.spend){
    const s=st.spend={rows:0,noAd:0,badDate:0,badAmt:0,total:0};
    for(const r of F.spend.rows){
      s.rows++;
      if(!nk(r[2])){s.noAd++;continue;}
      const dt=parseDT(r[3],dmy);if(!dt){s.badDate++;continue;}
      let v=parseAmt(r[4]);if(v===null){s.badAmt++;v=0;}
      cell(getAd(r[1],r[2],r[0]),dt.d)[0]+=v;s.total+=v;
    }
  }
  const entries=[];
  if(F.leads){
    const s=st.leads={rows:0,organic:0,noAd:0,badDate:0,counted:0,invalidPhone:0};
    F.leads.rows.forEach((r,i)=>{
      s.rows++;
      if(/^(true|1|yes)$/i.test(String(r[4]).trim())){s.organic++;return;}
      if(!nk(r[2])){s.noAd++;return;}
      const dt=parseDT(r[3],dmy);if(!dt){s.badDate++;return;}
      const p=cleanPhone(r[5]);if(!p)s.invalidPhone++;
      const a=getAd(r[1],r[2],r[0]);cell(a,dt.d)[1]++;s.counted++;
      entries.push({a,d:dt.d,t:dt.t,i,p,sk:nk(r[1])});
    });
  }
  entries.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:x.t-y.t||x.i-y.i);
  const groups=new Map(),phones=new Set();
  for(const e of entries){if(!e.p)continue;const k=e.p+'|'+e.sk;let g=groups.get(k);if(!g){g=[];groups.set(k,g);}g.push(e);phones.add(e.p);}

  const credit=(id,col)=>{
    const f=F[id];if(!f)return;
    const s=st[id]={rows:f.rows.length,invalid:0,dup:0,unmapped:0,mismatch:0,credited:0,skipped:!F.leads};
    if(!F.leads)return;
    const seen=new Set();
    for(const r of f.rows){
      const p=cleanPhone(r[0]);if(!p){s.invalid++;continue;}
      const k=p+'|'+nk(r[1]);if(seen.has(k)){s.dup++;continue;}seen.add(k);
      const g=groups.get(k);
      if(!g){s.unmapped++;if(phones.has(p))s.mismatch++;continue;}
      cell(g[0].a,g[0].d)[col]++;s.credited++;
      if(id==='fresh'&&f.hasQ&&INVALID_TAGS.has(nk(r[2]))){cell(g[0].a,g[0].d)[5]++;s.invalidTag=(s.invalidTag||0)+1;}
    }
  };
  credit('fresh',2);credit('qual',3);credit('td',4);

  if(F.gen&&F.leads){
    const used=new Set(),s=st.gen={rows:F.gen.rows.length,invalid:0,matched:0,sfOnly:0,metaOnly:0};
    for(const r of F.gen.rows){
      const p=cleanPhone(r[0]);if(!p){s.invalid++;continue;}
      const g=groups.get(p+'|'+nk(r[1]));const dt=parseDT(r[2],dmy);
      let best=null,bd=9;
      if(g)for(const e of g){if(used.has(e))continue;const df=dt?Math.abs(dayDiff(e.d,dt.d)):0;if(df<bd){bd=df;best=e;if(df===0)break;}}
      if(best&&bd<=1){used.add(best);s.matched++;}else s.sfOnly++;
    }
    s.metaOnly=entries.filter(e=>e.p&&!used.has(e)).length;
  }

  const G=[0,0,0,0,0,0];let min=null,max=null,spendNoLeads=0,leadsNoSpend=0;
  for(const a of ads.values()){
    let sp=0,ld=0;
    for(const d in a.days){
      const c=a.days[d];
      for(let i=0;i<6;i++)G[i]+=c[i];
      sp+=c[0];ld+=c[1];
      if(min===null||d<min)min=d;if(max===null||d>max)max=d;
    }
    if(F.spend&&F.leads){if(sp>0&&ld===0)spendNoLeads++;if(ld>0&&sp===0)leadsNoSpend++;}
  }
  let lmin=null,lmax=null;for(const e of entries){if(lmin===null||e.d<lmin)lmin=e.d;if(lmax===null||e.d>lmax)lmax=e.d;}
  return {ads,G,st,min,max,lmin,lmax,spendNoLeads,leadsNoSpend};
}
function avail(){const F=S.files;return [!!F.spend,!!F.leads,!!(F.fresh&&F.leads),!!(F.qual&&F.leads),!!(F.td&&F.leads),!!(F.fresh&&F.fresh.hasQ&&F.leads)];}
function recompute(){D=compute();}

/* ---------- Publish payload (aggregated only: no phone numbers) ---------- */
function buildPayload(){
  const ads=[];
  for(const a of D.ads.values()){
    const days={};let any=false;
    for(const d in a.days){
      const c=a.days[d];
      if(c.some(v=>v)){days[d]=c.map(v=>Math.round(v*100)/100);any=true;}
    }
    if(any)ads.push({ad:a.ad,adset:a.adset,campaign:a.campaign,days});
  }
  return {schema:1,generatedAt:Date.now(),avail:avail(),min:D.min,max:D.max,ads};
}
function canPublish(){
  if(!S.files.spend||!S.files.leads)return 'Load Meta Spend and Meta Leads first.';
  if(!D||!D.ads.size)return 'No usable data found in the loaded files.';
  return '';
}
function toB64(str){
  const bytes=new TextEncoder().encode(str);let bin='';const ch=0x8000;
  for(let i=0;i<bytes.length;i+=ch)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch));
  return btoa(bin);
}
function downloadJSON(){
  const why=canPublish();if(why){S.pub={state:'err',msg:why};render();return;}
  const json=JSON.stringify(buildPayload());
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='data.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

/* ---------- Publish to GitHub via API ---------- */
async function ghFetch(url,opt,token){
  const r=await fetch(url,Object.assign({cache:'no-store'},opt,{headers:Object.assign({'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},(opt&&opt.headers)||{})}));
  return r;
}
async function errText(r){
  let m='';try{const j=await r.json();m=j&&j.message?j.message:'';}catch(e){}
  if(r.status===401)return 'GitHub rejected the token (401). It may be wrong or expired.';
  if(r.status===403)return 'Access denied (403). '+(m||'The token may lack Contents read/write permission, or you hit a rate limit.');
  if(r.status===404)return 'Not found (404). Check owner, repository and branch, and that the token has access to this repository.';
  if(r.status===409||r.status===422)return 'Conflict while saving ('+r.status+'). '+m;
  return 'GitHub error '+r.status+'. '+m;
}
async function publish(){
  const c=S.cfg,why=canPublish();
  if(why){S.pub={state:'err',msg:why};render();return;}
  const owner=c.owner.trim(),repo=c.repo.trim(),branch=c.branch.trim()||'main',path=c.path.trim().replace(/^\/+/,''),token=c.token.trim();
  if(!owner||!repo||!path||!token){S.pub={state:'err',msg:'Fill in owner, repository, file path and token.'};render();return;}
  S.pub={state:'busy',msg:'Publishing…'};render();
  try{
    const payload=buildPayload(),json=JSON.stringify(payload),content=toB64(json);
    const base='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
    let res=null;
    for(let attempt=0;attempt<2;attempt++){
      let sha=null;
      const g=await ghFetch(base+'?ref='+encodeURIComponent(branch),{},token);
      if(g.status===200){const j=await g.json();if(Array.isArray(j))throw new Error('The path points to a folder, not a file.');sha=j.sha;}
      else if(g.status!==404)throw new Error(await errText(g));
      else{ // 404 can mean a missing file or a wrong repo; check the repo itself once
        if(attempt===0){const rr=await ghFetch('https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo),{},token);if(!rr.ok)throw new Error(await errText(rr));}
      }
      const body={message:'Update dashboard data ('+fmtDT(Date.now())+')',content,branch};if(sha)body.sha=sha;
      res=await ghFetch(base,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},token);
      if(res.ok)break;
      if(attempt===0&&(res.status===409||res.status===422))continue;
      throw new Error(await errText(res));
    }
    if(!res||!res.ok)throw new Error('Could not save the file after retrying.');
    const kb=Math.round(json.length/1024);
    S.pub={state:'ok',msg:'Published '+nf.format(payload.ads.length)+' ads ('+nf.format(kb)+' KB) at '+fmtDT(Date.now())+'. GitHub Pages usually takes 1 to 2 minutes to show the new data on the public page.',at:Date.now()};
    try{localStorage.setItem(PK+'.lastPub',String(Date.now()));}catch(e){}
  }catch(e){
    S.pub={state:'err',msg:(e&&e.message)||String(e)};
  }
  render();
}

/* ---------- Render ---------- */
function healthRows(){
  const st=D.st,r=[],F=S.files,inr=v=>'₹'+nf.format(Math.round(v));
  if(st.spend){const s=st.spend;r.push(['Meta Spend','Rows read',nf.format(s.rows),'']);r.push(['Meta Spend','Total spend loaded',inr(s.total),'Compare with Ads Manager total for the same period.']);
    r.push(['Meta Spend','Rows skipped: no ad name',nf.format(s.noAd),'Ad-set or campaign level rows.']);
    r.push(['Meta Spend','Rows skipped: unreadable date',nf.format(s.badDate),'Usually the totals row at the bottom of the export.']);
    if(s.badAmt)r.push(['Meta Spend','Rows with unreadable amount (counted as 0)',nf.format(s.badAmt),'']);}
  if(st.leads){const s=st.leads;r.push(['Meta Leads','Rows read',nf.format(s.rows),'Covers '+(D.lmin||'-')+' to '+(D.lmax||'-')+'. Qualified and test drive rows older than this cannot be linked.']);
    r.push(['Meta Leads','Counted as leads',nf.format(s.counted),'']);
    r.push(['Meta Leads','Excluded: organic',nf.format(s.organic),'']);
    r.push(['Meta Leads','Skipped: no ad name',nf.format(s.noAd),'']);
    r.push(['Meta Leads','Skipped: unreadable created_time',nf.format(s.badDate),'']);
    r.push(['Meta Leads','Counted but phone invalid (under 10 digits)',nf.format(s.invalidPhone),'Counted as leads; cannot be linked to Fresh, Qualified or Test Drive.']);}
  for(const id of ['fresh','qual','td']){
    const s=st[id],def=DEFS.find(d=>d.id===id);if(!s)continue;
    if(s.skipped){r.push([def.label,'Not applied','-','Load Meta Leads first.']);continue;}
    r.push([def.label,'Rows read',nf.format(s.rows),'']);
    r.push([def.label,'Credited to an ad',nf.format(s.credited),'']);
    if(id==='fresh')r.push([def.label,'  of which tagged Invalid Leads',F.fresh.hasQ?nf.format(s.invalidTag||0):'n/a','Not Enquired, Invalid Number, Non-Sales Related, Wrong number, Aftersales.'+(F.fresh.hasQ?'':' Quality Type column not found: reload this file.')]);
    r.push([def.label,'Hidden: no matching Meta lead',nf.format(s.unmapped),'Phone + ad set not found in Meta Leads. Usually the Meta dump does not go back far enough.']);
    r.push([def.label,'  of which phone found under a different ad set',nf.format(s.mismatch),'Possible ad set renamed or edited; check names.']);
    r.push([def.label,'Invalid phone skipped',nf.format(s.invalid),'']);
    r.push([def.label,'Duplicate phone + ad set ignored',nf.format(s.dup),'']);
  }
  if(st.gen){const s=st.gen;r.push(['Sync check','SF Generated rows matched to Meta leads',nf.format(s.matched),'Same phone + ad set, same day or within 1 day.']);
    r.push(['Sync check','SF Generated rows with no Meta match',nf.format(s.sfOnly),'']);
    r.push(['Sync check','Meta leads with no SF Generated row',nf.format(s.metaOnly),'Possible sync gap between Meta and Salesforce.']);}
  if(F.spend&&F.leads){r.push(['Ads','Ads with spend but no leads in the data',nf.format(D.spendNoLeads),'Check if ad names differ between Meta Spend and Meta Leads.']);
    r.push(['Ads','Ads with leads but no spend in the data',nf.format(D.leadsNoSpend),'Spend file may not cover the same dates, or the ad was renamed.']);}
  return r;
}
function summaryHTML(){
  if(!D||!D.ads.size)return '';
  const G=D.G,av=avail(),t=(i,ok)=>ok?nf.format(G[i]):'n/a';
  const box=(v,l)=>'<div><b>'+v+'</b><span>'+l+'</span></div>';
  return '<h3>What will be published</h3><div class="sum">'+
    box(nf.format(D.ads.size),'Ads')+
    box((D.min||'-')+' to '+(D.max||'-'),'Date range')+
    box(av[0]?'₹'+nf.format(Math.round(G[0])):'n/a','Spend')+
    box(t(1,av[1]),'Leads')+box(t(2,av[2]),'Fresh leads')+box(t(5,av[5]),'Invalid leads')+box(t(3,av[3]),'Qualified')+box(t(4,av[4]),'Test drives')+
    '</div>';
}
function publishHTML(){
  const c=S.cfg,why=canPublish(),busy=S.pub.state==='busy';
  const f=(id,l,v,type)=>'<label>'+l+'<input id="cfg_'+id+'" type="'+(type||'text')+'" value="'+esc(v)+'" autocomplete="off" spellcheck="false"></label>';
  let last='';try{const t=+localStorage.getItem(PK+'.lastPub');if(t)last='Last published from this browser: '+fmtDT(t)+'.';}catch(e){}
  return '<div class="panel"><h3>Publish to GitHub Pages</h3>'+
    '<p class="note">Publishing saves only per-ad, per-day totals to <b>'+esc(c.path)+'</b> in your repository. No phone numbers are uploaded. The public page reads that file. '+esc(last)+'</p>'+
    '<div class="grid">'+f('owner','GitHub username',c.owner)+f('repo','Repository',c.repo)+f('branch','Branch',c.branch)+f('path','Data file path',c.path)+f('token','Personal access token (fine-grained, Contents: read and write)',c.token,'password')+'</div>'+
    '<label class="chk" style="margin-bottom:12px"><input type="checkbox" id="cfg_remember"'+(c.remember?' checked':'')+'> Remember the token in this browser only</label>'+
    '<div class="btns"><button class="btn pri" id="pubgo"'+(why||busy?' disabled':'')+'>Publish to GitHub</button><button class="btn" id="pubdl"'+(why?' disabled':'')+'>Download data.json instead</button>'+(why?'<span class="note" style="margin:0">'+esc(why)+'</span>':'')+'</div>'+
    (S.pub.msg?'<div class="msg '+S.pub.state+'">'+esc(S.pub.msg)+'</div>':'')+
    '</div>';
}
function render(){
  savePrefs();
  const el=$('#main');
  let h='<p class="note">Files are read inside your browser and saved in this browser only (not on GitHub). Loading a file replaces the previous copy of that file. CSV only (for Excel files, use Save As CSV).</p>';
  if(!S.idbOk)h+='<div class="banner">Browser storage is unavailable here, so loaded data will be lost when this tab closes.</div>';
  h+='<div class="cards">';
  for(const def of DEFS){
    const f=S.files[def.id],err=S.errors[def.id];
    h+='<div class="card"><h3>'+def.label+'</h3><div class="d">'+esc(def.desc)+'</div>'+
      '<label class="drop" data-id="'+def.id+'">'+(S.busy[def.id]?'Reading file…':'Drop CSV here or click to choose')+'<input type="file" accept=".csv,.tsv,.txt,text/csv" data-id="'+def.id+'"></label>'+
      (err?'<div class="st err">'+esc(err)+'</div>':f?'<div class="st ok">Loaded: '+esc(f.name)+'<br>'+nf.format(f.rows.length)+' rows · '+fmtDT(f.loadedAt)+' · <a href="#" data-clear="'+def.id+'" style="color:var(--mut)">remove</a></div>':'<div class="st no">Not loaded</div>')+
      '</div>';
  }
  h+='</div><h3>Date format</h3><p class="note">Only used when a date is written like 05/10/2026. ISO dates (2026-10-05) and timestamps with a timezone are read exactly. Timestamps with an explicit timezone are converted to IST.</p>'+
    '<select id="dmy" style="margin-bottom:18px"><option value="1"'+(S.dmy?' selected':'')+'>Day / Month / Year</option><option value="0"'+(!S.dmy?' selected':'')+'>Month / Day / Year</option></select>';
  const missing=DEFS.filter(d=>['fresh','qual','td'].includes(d.id)&&!S.files[d.id]);
  if(S.files.leads&&missing.length)h+='<div class="banner">Not loaded: '+missing.map(m=>m.label).join(', ')+'. Those rows will show n/a on the public page.</div>';
  if(S.files.fresh&&!S.files.fresh.hasQ)h+='<div class="banner">SF Fresh leads has no Quality Type column (or was loaded before this update). Reload it to publish Invalid Leads.</div>';
  h+=summaryHTML()+publishHTML();
  if(D&&Object.keys(D.st).length){
    h+='<h3>Data health</h3><table class="h"><tr><th>Source</th><th>Check</th><th>Value</th><th>Note</th></tr>'+
      healthRows().map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="v">'+esc(r[2])+'</td><td class="n">'+esc(r[3])+'</td></tr>').join('')+'</table>';
  }
  el.innerHTML=h;
}
async function handleFile(id,file){
  const def=DEFS.find(d=>d.id===id);
  S.errors[id]='';S.busy[id]=true;render();
  await new Promise(r=>setTimeout(r,30));
  try{
    const text=await file.text();
    if(text.startsWith('PK'))throw new Error('This looks like an Excel file. Save it as CSV and upload again.');
    const rows=parseCSV(text);
    if(rows.length<2)throw new Error('The file has no data rows.');
    const idx=mapCols(def,rows[0]),out=[];
    for(let i=1;i<rows.length;i++){const r=rows[i];out.push(def.order.map(k=>idx[k]>=0&&r[idx[k]]!=null?r[idx[k]]:''));}
    const rec={name:file.name,loadedAt:Date.now(),rows:out,hasQ:idx.qtype>=0};
    S.files[id]=rec;
    const ok=await IDB.set(id,rec);if(ok===null)S.idbOk=false;
  }catch(e){S.errors[id]=e.message||String(e);}
  S.busy[id]=false;S.pub={state:'idle',msg:''};recompute();render();
}
async function clearFile(id){delete S.files[id];S.errors[id]='';await IDB.del(id);S.pub={state:'idle',msg:''};recompute();render();}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-clear]');if(c){e.preventDefault();clearFile(c.dataset.clear);return;}
  if(e.target.id==='pubgo'){publish();return;}
  if(e.target.id==='pubdl'){downloadJSON();return;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id&&t.id.startsWith('cfg_')&&t.type!=='checkbox'){S.cfg[t.id.slice(4)]=t.value;savePrefs();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[type=file][data-id]')){if(t.files[0])handleFile(t.dataset.id,t.files[0]);t.value='';return;}
  if(t.id==='cfg_remember'){S.cfg.remember=t.checked;savePrefs();return;}
  if(t.id==='dmy'){S.dmy=t.value==='1';S.pub={state:'idle',msg:''};recompute();render();return;}
});
document.addEventListener('dragover',e=>{const z=e.target.closest('.drop');if(z){e.preventDefault();z.classList.add('over');}});
document.addEventListener('dragleave',e=>{const z=e.target.closest('.drop');if(z)z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest('.drop');if(z){e.preventDefault();z.classList.remove('over');if(e.dataTransfer.files[0])handleFile(z.dataset.id,e.dataTransfer.files[0]);}});

/* ---------- Boot ---------- */
(async function(){
  loadPrefs();
  S.idbOk=await IDB.open();
  if(S.idbOk){for(const def of DEFS){const rec=await IDB.get(def.id);if(rec&&rec.rows)S.files[def.id]=rec;}}
  recompute();
  render();
  window.__admin={S,get D(){return D;},compute,buildPayload,parseDT,cleanPhone,parseCSV};
})();
})();
</script>
